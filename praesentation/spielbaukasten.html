<title>Der Spiele-Baukasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#FFFCF5; --karte:#FFFFFF; --karte-2:#FBF6EA;
  --tinte:#221F2B; --tinte-weich:#5E5866; --tinte-blass:#948D9C;
  --linie:#E4DCCB;
  --rot:#DB4A24; --teal:#1E7A72; --gelb:#E8A600; --lila:#6B4E9E;
  --rot-bg:#FBE7E0; --teal-bg:#DEEEEC; --gelb-bg:#FBF0D5; --lila-bg:#EBE5F5;
  --schatten:0 2px 0 var(--linie),0 10px 24px -14px rgba(34,31,43,.4);
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --text:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16151C; --karte:#1E1D26; --karte-2:#25232E;
  --tinte:#F2EFE8; --tinte-weich:#ACA6B4; --tinte-blass:#7B7585;
  --linie:#332F3D;
  --rot:#FF8259; --teal:#5CC0B5; --gelb:#F5C43F; --lila:#AE93E0;
  --rot-bg:#33201A; --teal-bg:#13302D; --gelb-bg:#33280E; --lila-bg:#251E33;
  --schatten:0 2px 0 var(--linie),0 12px 28px -16px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#16151C; --karte:#1E1D26; --karte-2:#25232E;
  --tinte:#F2EFE8; --tinte-weich:#ACA6B4; --tinte-blass:#7B7585;
  --linie:#332F3D;
  --rot:#FF8259; --teal:#5CC0B5; --gelb:#F5C43F; --lila:#AE93E0;
  --rot-bg:#33201A; --teal-bg:#13302D; --gelb-bg:#33280E; --lila-bg:#251E33;
  --schatten:0 2px 0 var(--linie),0 12px 28px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tinte);font-family:var(--text);font-size:17px;line-height:1.6;margin:0;padding:0 18px 70px;-webkit-font-smoothing:antialiased}
.huelle{max-width:900px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}

/* Kopf */
header{padding:34px 0 20px}
.marke{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;flex:none}
.marke h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.marke p{font-size:.92rem;color:var(--tinte-weich)}

/* Bauleiste */
.bauleiste{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 26px;min-height:36px}
.teil{
  display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 9px;border-radius:99px;
  font-size:.86rem;font-weight:700;background:var(--karte);border:2px solid var(--linie);
  animation:rein .28s cubic-bezier(.2,1.2,.4,1);
}
.teil b{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinte-blass)}
@keyframes rein{from{transform:scale(.8) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.teil.leer{background:transparent;border-style:dashed;color:var(--tinte-blass);font-weight:400}

/* Frage */
.frage-karte{background:var(--karte);border:2px solid var(--linie);border-radius:16px;padding:26px 26px 30px;box-shadow:var(--schatten)}
.schritt-zahl{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tinte-blass)}
.frage-karte h2{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.unterfrage{color:var(--tinte-weich);font-size:1rem;max-width:56ch}
.optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:24px}
.opt{
  text-align:left;cursor:pointer;background:var(--karte-2);border:2px solid var(--linie);
  border-radius:13px;padding:16px 16px 18px;color:inherit;
  display:flex;flex-direction:column;gap:5px;transition:transform .14s ease,border-color .14s ease,background .14s ease;
}
.opt:hover{transform:translateY(-3px);border-color:var(--tinte-blass)}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt .sym{font-size:1.5rem;line-height:1}
.opt .titel{font-family:var(--display);font-size:1.22rem;font-weight:700}
.opt .info{font-size:.9rem;color:var(--tinte-weich);line-height:1.42}
.opt.gewaehlt{background:var(--teal-bg);border-color:var(--teal)}
.steuer{display:flex;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap}
.knopf{cursor:pointer;border-radius:10px;padding:11px 20px;font-weight:700;font-size:.96rem;border:2px solid var(--linie);background:var(--karte);color:var(--tinte)}
.knopf:hover{border-color:var(--tinte-blass)}
.knopf:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.knopf.stark{background:var(--rot);border-color:var(--rot);color:#fff}
:root[data-theme="dark"] .knopf.stark,
:root:not([data-theme="light"]) .knopf.stark{color:#221F2B}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .knopf.stark{color:#fff}}
.fortschritt{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--linie);overflow:hidden}
.fortschritt i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s ease}

/* Bauplan */
.bauplan{display:none}
.bauplan.an{display:block}
.plan-kopf{background:var(--karte);border:2px solid var(--linie);border-radius:16px;padding:26px;box-shadow:var(--schatten);margin-bottom:16px}
.plan-kopf .stempel{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rot);font-weight:600}
.namensfeld{font-family:var(--display);font-size:clamp(1.7rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;background:transparent;border:0;border-bottom:3px dashed var(--linie);color:var(--tinte);width:100%;padding:4px 0;margin:8px 0 4px}
.namensfeld:focus{outline:0;border-bottom-color:var(--rot)}
.erfinder{font-family:var(--text);font-size:.98rem;background:transparent;border:0;border-bottom:2px dashed var(--linie);color:var(--tinte-weich);padding:3px 0;width:min(100%,340px)}
.erfinder:focus{outline:0;border-bottom-color:var(--rot)}

.bloecke{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.block{background:var(--karte);border:2px solid var(--linie);border-radius:16px;padding:22px 24px 24px}
.block.weit{grid-column:1/-1}
.block h3{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.block h3 .pille{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.liste li{display:flex;gap:11px;align-items:baseline;font-size:.98rem}
.liste .menge{font-family:var(--mono);font-weight:600;font-size:.88rem;color:var(--rot);min-width:2.6em;flex:none;font-variant-numeric:tabular-nums}
ol.schritte{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:.98rem}
ol.schritte::marker{font-weight:700}
.regel-titel{font-family:var(--display);font-weight:700;font-size:1rem;display:block;margin-bottom:2px}
.regel{padding:12px 0;border-bottom:1px dashed var(--linie)}
.regel:last-child{border-bottom:0}
.regel p{font-size:.98rem;color:var(--tinte-weich)}
.brett-huelle{background:var(--karte-2);border-radius:12px;padding:16px;overflow-x:auto}
.brett-huelle svg{display:block;margin:0 auto;max-width:100%;height:auto}
.brett-huelle svg rect,.brett-huelle svg ellipse{stroke:var(--tinte);stroke-width:1.8}
.brett-huelle svg .fn{fill:var(--karte)}
.brett-huelle svg .fs{fill:var(--teal)}
.brett-huelle svg .ff{fill:var(--rot)}
.brett-huelle svg .fa{fill:var(--gelb)}
.brett-huelle svg .stapel{fill:var(--karte-2);stroke-dasharray:6 5;stroke-width:2}
.brett-huelle svg .fuehrung{fill:none;stroke:var(--linie);stroke-width:2;stroke-dasharray:5 6}
.brett-huelle svg .verbinder{fill:none;stroke:var(--linie);stroke-width:3}
.brett-huelle svg .bt{font-family:var(--display);font-size:20px;font-weight:800;fill:var(--tinte)}
.brett-huelle svg .bs{font-family:var(--text);font-size:13px;fill:var(--tinte-weich)}
.brett-huelle svg .bx{font-family:var(--text);font-size:12px;fill:var(--tinte-weich)}
.brett-bei{font-size:.86rem;color:var(--tinte-blass);margin-top:10px;text-align:center}
.stellschraube{background:var(--gelb-bg);border-left:4px solid var(--gelb);border-radius:0 8px 8px 0;padding:12px 15px;font-size:.95rem}
.testauftrag{background:var(--lila-bg);border:2px dashed var(--lila);border-radius:14px;padding:20px 24px;margin-top:16px}
.testauftrag h3{color:var(--lila);margin-bottom:8px}
.fuss-steuer{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.fuss-steuer span{font-size:.88rem;color:var(--tinte-blass)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .nodruck,header,.bauleiste{display:none!important}
  .block,.plan-kopf{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .bloecke{display:block}
  .block{margin-bottom:12px}
}
</style>

<div class="huelle">

<header class="nodruck">
  <div class="marke">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="3" y="12" width="22" height="22" rx="4" fill="var(--gelb)" stroke="var(--tinte)" stroke-width="2.4"/>
      <circle cx="10" cy="19" r="2" fill="var(--tinte)"/><circle cx="18" cy="27" r="2" fill="var(--tinte)"/>
      <path d="M22 4 L36 4 L36 18 Z" fill="var(--teal)" stroke="var(--tinte)" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>Der Spiele-Baukasten</h1>
      <p>Sieben Entscheidungen — und du hast einen Bauplan.</p>
    </div>
  </div>
  <div class="bauleiste" id="bauleiste"></div>
</header>

<main>
  <div class="frage-karte nodruck" id="frage"></div>
  <div class="bauplan" id="bauplan"></div>
</main>

</div>

<script>
/* ============ Daten ============ */
const THEMEN = {
  weltraum:{name:"Weltraum",sym:"🚀",figur:"Rakete",zielAkk:"den Heimatplaneten",zielDat:"zum Heimatplaneten",falle:"Meteoritenschauer",bonus:"Treibstoff",tausch:"Beamer",feindNom:"das Alien",feindDat:"dem Alien",farben:"Schwarz, Silber, Neongrün"},
  dschungel:{name:"Dschungel",sym:"🌴",figur:"Forscherin",zielAkk:"den verlorenen Tempel",zielDat:"zum verlorenen Tempel",falle:"Treibsand",bonus:"Bananen",tausch:"freche Papagei",feindNom:"die Schlange",feindDat:"der Schlange",farben:"Grün, Braun, Knallgelb"},
  piraten:{name:"Piraten",sym:"🏴‍☠️",figur:"Schiff",zielAkk:"die Schatzinsel",zielDat:"zur Schatzinsel",falle:"Strudel",bonus:"Goldmünzen",tausch:"Enterhaken",feindNom:"der Krake",feindDat:"dem Kraken",farben:"Blau, Sandbeige, Rot"},
  drachen:{name:"Drachen",sym:"🐉",figur:"Drachenbaby",zielAkk:"die Drachenhöhle",zielDat:"zur Drachenhöhle",falle:"Ritterfalle",bonus:"Edelsteine",tausch:"Zauberspruch",feindNom:"der Ritter",feindDat:"dem Ritter",farben:"Lila, Gold, Dunkelrot"},
  schule:{name:"Schule",sym:"🎒",figur:"Schulranzen",zielAkk:"den Pausenhof",zielDat:"zum Pausenhof",falle:"Hausaufgaben-Falle",bonus:"Fleißpunkte",tausch:"Radiergummi-Tausch",feindNom:"der Vertretungslehrer",feindDat:"dem Vertretungslehrer",farben:"Kreideweiß, Tafelgrün, Filzstiftrot"},
  tiere:{name:"Waldtiere",sym:"🦔",figur:"Igel",zielAkk:"den warmen Bau",zielDat:"zum warmen Bau",falle:"Pfütze",bonus:"Nüsse",tausch:"Verstecken",feindNom:"der Fuchs",feindDat:"dem Fuchs",farben:"Herbstbraun, Moosgrün, Orange"}
};

const ETIKETT = {ziel:"Ziel",feld:"Feld",mechanik:"Zug",glueck:"Glück",trick:"Trick",thema:"Thema",groesse:"Größe"};

const SCHRITTE = [
  {
    key:"ziel", frage:"Wie gewinnt man dein Spiel?",
    unter:"Das ist die wichtigste Entscheidung. Alles andere hängt daran.",
    optionen:[
      {id:"rennen",sym:"🏁",titel:"Wettrennen",info:"Wer zuerst am Ziel ist, gewinnt."},
      {id:"sammeln",sym:"💎",titel:"Sammeln",info:"Wer am Ende am meisten hat, gewinnt."},
      {id:"fangen",sym:"👻",titel:"Fangen",info:"Einer jagt, die anderen fliehen."},
      {id:"zusammen",sym:"🤝",titel:"Alle zusammen",info:"Ihr gewinnt gemeinsam — oder verliert gemeinsam."}
    ]
  },
  {
    key:"feld", frage:"Worauf wird gespielt?",
    unter:"Nicht jedes Spielfeld passt zu jedem Ziel. Du siehst nur, was funktioniert.",
    optionen:[
      {id:"rundkurs",sym:"⭕",titel:"Rundkurs",info:"Ein Weg im Kreis, wie beim Mensch-ärgere-dich-nicht.",wenn:["rennen","fangen","zusammen"]},
      {id:"raster",sym:"▦",titel:"Karo-Feld",info:"Ein Gitter aus Kästchen, wie ein Schachbrett.",wenn:["sammeln","fangen","zusammen"]},
      {id:"pfad",sym:"🛤️",titel:"Weg mit Abzweigungen",info:"Ein Pfad, bei dem man sich entscheiden muss.",wenn:["rennen","zusammen","sammeln"]},
      {id:"kein",sym:"🃏",titel:"Gar kein Brett",info:"Nur Karten auf dem Tisch. Schnell gebastelt!",wenn:["sammeln","fangen"]}
    ]
  },
  {
    key:"mechanik", frage:"Was machst du, wenn du dran bist?",
    unter:"Der Motor deines Spiels. Das passiert in jedem einzelnen Zug.",
    optionen:[
      {id:"wuerfel",sym:"🎲",titel:"Würfeln und ziehen",info:"Würfel entscheidet, wie weit du kommst.",wenn:["rundkurs","pfad","raster"]},
      {id:"karte",sym:"🎴",titel:"Eine Karte ausspielen",info:"Du hast Karten auf der Hand und wählst eine.",wenn:["rundkurs","pfad","raster","kein"]},
      {id:"setzen",sym:"📍",titel:"Etwas hinlegen",info:"Du legst ein Plättchen oder eine Figur auf ein Feld.",wenn:["raster","kein","pfad"]},
      {id:"geschick",sym:"🎯",titel:"Zielen und schnippen",info:"Du musst treffen, stapeln oder schnippen.",wenn:["rundkurs","raster","kein"]}
    ]
  },
  {
    key:"glueck", frage:"Wie viel Glück soll dabei sein?",
    unter:"Ganz viel Glück ist lustig. Ganz wenig Glück ist knifflig. Du entscheidest.",
    optionen:[
      {id:"viel",sym:"🍀",titel:"Ganz viel Glück",info:"Auch kleine Geschwister können gewinnen."},
      {id:"misch",sym:"⚖️",titel:"Halb und halb",info:"Glück hilft, aber Nachdenken hilft mehr."},
      {id:"koennen",sym:"🧠",titel:"Fast nur Können",info:"Wer klug plant, gewinnt. Für Knobelfans."}
    ]
  },
  {
    key:"trick", frage:"Was ist dein besonderer Trick?",
    unter:"Die eine Regel, die dein Spiel anders macht als alle anderen.",
    optionen:[
      {id:"falle",sym:"⚠️",titel:"Fallen-Felder",info:"Auf manchen Feldern passiert etwas Fieses."},
      {id:"abkuerzung",sym:"↗️",titel:"Geheime Abkürzung",info:"Ein Weg, der viel schneller ist — aber riskant.",wenn_feld:["rundkurs","pfad","raster"]},
      {id:"tausch",sym:"🔄",titel:"Klauen und Tauschen",info:"Du darfst anderen etwas wegnehmen.",wenn_ziel:["sammeln","rennen","fangen"]},
      {id:"bonus",sym:"⭐",titel:"Bonus-Karten",info:"Sammle Karten, die dir Extra-Kräfte geben."},
      {id:"zeitdruck",sym:"⏳",titel:"Sanduhr",info:"Alles muss schnell gehen. Wer trödelt, verliert."},
      {id:"helfen",sym:"🫱",titel:"Helfen erlaubt",info:"Ihr dürft euch gegenseitig retten.",wenn_ziel:["zusammen"]}
    ]
  },
  {
    key:"thema", frage:"Worum geht es in deinem Spiel?",
    unter:"Jetzt bekommt alles einen Namen. Die Regeln bleiben genau gleich — nur die Verpackung ändert sich.",
    optionen:Object.entries(THEMEN).map(([id,t])=>({id,sym:t.sym,titel:t.name,info:"Farben: "+t.farben}))
  },
  {
    key:"groesse", frage:"Wie groß soll es werden?",
    unter:"Danach richtet sich, wie viel du basteln musst.",
    optionen:[
      {id:"klein",sym:"🐜",titel:"Klein und schnell",info:"2 Spieler, etwa 10 Minuten. In einer Doppelstunde fertig."},
      {id:"mittel",sym:"🐕",titel:"Mittel",info:"3–4 Spieler, etwa 20 Minuten. Der übliche Fall."},
      {id:"gross",sym:"🐘",titel:"Groß",info:"4–6 Spieler, etwa 30 Minuten. Braucht zwei Doppelstunden."}
    ]
  }
];

const MASSE = {
  klein:{spieler:"2",felder:20,karten:12,dauer:"10",figuren:2,plaettchen:10},
  mittel:{spieler:"3–4",felder:32,karten:20,dauer:"20",figuren:4,plaettchen:16},
  gross:{spieler:"4–6",felder:44,karten:30,dauer:"30",figuren:6,plaettchen:24}
};

/* Zugregel je Mechanik × Glück */
const ZUGREGEL = {
  wuerfel:{
    viel:"Du würfelst einmal und ziehst so viele Felder weiter. Fertig — der nächste ist dran.",
    misch:"Du würfelst mit zwei Würfeln und darfst dir einen aussuchen. Der andere zählt nicht.",
    koennen:"Zu Beginn deines Zuges würfelst du dreimal und legst die Zahlen vor dich. Du entscheidest, in welcher Reihenfolge du sie benutzt."
  },
  karte:{
    viel:"Du ziehst eine Karte vom Stapel und musst sie sofort spielen. Kein Aussuchen!",
    misch:"Du hast drei Karten auf der Hand und spielst eine davon aus. Danach ziehst du wieder auf drei nach.",
    koennen:"Du hast fünf Karten auf der Hand und ziehst erst nach, wenn du keine mehr hast. Denk gut nach, wann du welche ausspielst."
  },
  setzen:{
    viel:"Du ziehst ein Plättchen aus dem Beutel und legst es auf ein freies Feld deiner Wahl.",
    misch:"Du wählst eines von drei offen ausliegenden Plättchen und legst es auf ein freies Feld.",
    koennen:"Du hast alle deine Plättchen offen vor dir und legst eines auf ein freies Feld. Wer vorausdenkt, gewinnt."
  },
  geschick:{
    viel:"Du schnippst einmal und nimmst, was dabei herauskommt. Auch danebenschießen gehört dazu.",
    misch:"Du hast zwei Versuche und darfst dir das bessere Ergebnis aussuchen.",
    koennen:"Du sagst vorher an, was du triffst. Nur wenn es klappt, zählt es — dafür doppelt."
  }
};

/* ============ Zustand ============ */
const wahl = {};
let schrittNr = 0;

function moeglich(o){
  if(o.wenn && !o.wenn.includes(wahl.ziel)) return false;
  if(o.wenn_ziel && !o.wenn_ziel.includes(wahl.ziel)) return false;
  if(o.wenn_feld && !o.wenn_feld.includes(wahl.feld)) return false;
  return true;
}
function optionenFuer(s){
  if(s.key==="feld") return s.optionen.filter(o=>o.wenn.includes(wahl.ziel));
  if(s.key==="mechanik") return s.optionen.filter(o=>o.wenn.includes(wahl.feld));
  return s.optionen.filter(moeglich);
}
function titelVon(key,id){
  const s=SCHRITTE.find(s=>s.key===key);
  const o=s.optionen.find(o=>o.id===id);
  return o?o.titel:id;
}

/* ============ Bauleiste ============ */
function zeichneBauleiste(){
  const el=document.getElementById("bauleiste");
  el.innerHTML=SCHRITTE.map((s,i)=>{
    if(wahl[s.key]!==undefined){
      const o=s.optionen.find(o=>o.id===wahl[s.key]);
      return `<span class="teil"><span aria-hidden="true">${o.sym}</span><span><b>${ETIKETT[s.key]}</b> ${o.titel}</span></span>`;
    }
    if(i===schrittNr) return `<span class="teil leer">… Schritt ${i+1}</span>`;
    return "";
  }).join("");
}

/* ============ Frage zeichnen ============ */
function zeichneFrage(){
  const wrap=document.getElementById("frage");
  if(schrittNr>=SCHRITTE.length){ zeigeBauplan(); return; }
  const s=SCHRITTE[schrittNr];
  const opts=optionenFuer(s);
  wrap.innerHTML=`
    <div class="schritt-zahl">Schritt ${schrittNr+1} von ${SCHRITTE.length}</div>
    <h2>${s.frage}</h2>
    <p class="unterfrage">${s.unter}</p>
    <div class="optionen">
      ${opts.map(o=>`<button class="opt ${wahl[s.key]===o.id?"gewaehlt":""}" data-id="${o.id}">
        <span class="sym" aria-hidden="true">${o.sym}</span>
        <span class="titel">${o.titel}</span>
        <span class="info">${o.info}</span>
      </button>`).join("")}
    </div>
    <div class="steuer">
      ${schrittNr>0?'<button class="knopf" id="zurueck">← Zurück</button>':""}
      <div class="fortschritt"><i style="width:${(schrittNr/SCHRITTE.length)*100}%"></i></div>
    </div>`;
  wrap.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    wahl[s.key]=b.dataset.id;
    // spätere Wahl kann ungültig geworden sein
    SCHRITTE.slice(schrittNr+1).forEach(sp=>{
      if(wahl[sp.key]!==undefined){
        const noch=optionenFuer(sp).some(o=>o.id===wahl[sp.key]);
        if(!noch) delete wahl[sp.key];
      }
    });
    schrittNr++;
    zeichneBauleiste(); zeichneFrage();
    window.scrollTo({top:0,behavior:"smooth"});
  }));
  const z=document.getElementById("zurueck");
  if(z) z.addEventListener("click",()=>{schrittNr--;zeichneBauleiste();zeichneFrage();});
  zeichneBauleiste();
}

/* ============ Spielbrett zeichnen ============ */
function brettSVG(){
  const m=MASSE[wahl.groesse], n=m.felder;
  const sonder={};
  if(wahl.trick==="falle") for(let i=4;i<n;i+=5) sonder[i]="ff";
  if(wahl.trick==="abkuerzung"){ sonder[Math.round(n*0.25)]="fa"; sonder[Math.round(n*0.7)]="fa"; }
  const kl = i => i===0 ? "fs" : (sonder[i] || "fn");

  if(wahl.feld==="rundkurs"){
    const w=460,h=340,cx=230,cy=170,rx=178,ry=126,s=22;
    let out=`<ellipse class="fuehrung" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+(i/n)*2*Math.PI;
      const x=(cx+rx*Math.cos(a)-s/2).toFixed(1), y=(cy+ry*Math.sin(a)-s/2).toFixed(1);
      out+=`<rect class="${kl(i)}" x="${x}" y="${y}" width="${s}" height="${s}" rx="4"/>`;
    }
    out+=`<text class="bt" x="${cx}" y="${cy-4}" text-anchor="middle">${n} Felder</text>`
       + `<text class="bs" x="${cx}" y="${cy+18}" text-anchor="middle">im Kreis</text>`;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Rundkurs mit ${n} Feldern">${out}</svg>`;
  }
  if(wahl.feld==="raster"){
    const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), c=44, g=5, pad=12;
    const w=pad*2+cols*c+(cols-1)*g, h=pad*2+rows*c+(rows-1)*g;
    let out="", i=0;
    for(let r=0;r<rows;r++){ for(let k=0;k<cols;k++){
      if(i>=n) break;
      out+=`<rect class="${kl(i)}" x="${pad+k*(c+g)}" y="${pad+r*(c+g)}" width="${c}" height="${c}" rx="6"/>`;
      i++;
    }}
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Karo-Feld mit ${n} Kästchen">${out}</svg>`;
  }
  if(wahl.feld==="pfad"){
    const cols=8, rows=Math.ceil(n/cols), c=40, g=12, pad=14;
    const w=pad*2+cols*c+(cols-1)*g, h=pad*2+rows*c+(rows-1)*g;
    let out="", i=0, punkte=[];
    for(let r=0;r<rows;r++){ for(let k=0;k<cols;k++){
      if(i>=n) break;
      const kk = r%2===0 ? k : cols-1-k;
      const x=pad+kk*(c+g), y=pad+r*(c+g);
      punkte.push([x+c/2,y+c/2]);
      out+=`<rect class="${kl(i)}" x="${x}" y="${y}" width="${c}" height="${c}" rx="8"/>`;
      i++;
    }}
    const linie=punkte.map((p,j)=>(j?"L":"M")+p[0]+" "+p[1]).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Weg mit ${n} Feldern"><path class="verbinder" d="${linie}"/>${out}</svg>`;
  }
  const w=460,h=200;
  let out=`<rect class="stapel" x="20" y="34" width="86" height="124" rx="8"/>`
    + `<text class="bx" x="63" y="100" text-anchor="middle">Nachzieh-</text>`
    + `<text class="bx" x="63" y="116" text-anchor="middle">stapel</text>`;
  for(let i=0;i<4;i++) out+=`<rect class="${i===0?"fs":"fn"}" x="${140+i*78}" y="34" width="66" height="124" rx="8"/>`;
  out+=`<text class="bs" x="230" y="184" text-anchor="middle">4 offene Karten in der Tischmitte</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Kartenauslage ohne Spielbrett">${out}</svg>`;
}

/* ============ Bauplan ============ */
function material(){
  const m=MASSE[wahl.groesse], t=THEMEN[wahl.thema], L=[];
  if(wahl.feld==="rundkurs") L.push([1,`Spielplan aus Pappe (A3), darauf ${m.felder} Felder im Kreis`]);
  if(wahl.feld==="raster")   L.push([1,`Spielplan aus Pappe (A3), Karo-Feld mit ${m.felder} Kästchen`]);
  if(wahl.feld==="pfad")     L.push([1,`Spielplan aus Pappe (A3), Weg mit ${m.felder} Feldern und 2 Abzweigungen`]);
  if(wahl.feld==="kein")     L.push([1,`Tischfläche — kein Spielplan nötig`]);
  L.push([m.figuren,`Spielfiguren „${t.figur}“ (Deckel, Korken oder ausgeschnittene Pappe mit Fuß)`]);
  if(wahl.mechanik==="wuerfel") L.push([wahl.glueck==="viel"?1:(wahl.glueck==="misch"?2:3),"Würfel"]);
  if(wahl.mechanik==="karte")   L.push([m.karten,"Blanko-Karten für den Nachziehstapel"]);
  if(wahl.mechanik==="setzen")  L.push([m.plaettchen,"Plättchen aus Pappe (ca. 3 × 3 cm), in Spielerfarben"]);
  if(wahl.mechanik==="geschick")L.push([m.figuren,"flache Scheiben zum Schnippen (Knöpfe oder Flaschendeckel)"]);
  if(wahl.trick==="falle")      L.push([Math.floor(m.felder/5),`Fallen-Felder „${t.falle}“ — rot markieren`]);
  if(wahl.trick==="bonus")      L.push([Math.round(m.karten/2)||6,`Bonus-Karten „${t.bonus}“`]);
  if(wahl.trick==="abkuerzung") L.push([2,"Abkürzungen — mit dickem Stift als Brücke einzeichnen"]);
  if(wahl.trick==="tausch")     L.push([1,`Merkzettel für die Tausch-Regel („${t.tausch}“)`]);
  if(wahl.trick==="zeitdruck")  L.push([1,"Sanduhr (30 Sekunden) oder Handy-Timer"]);
  if(wahl.trick==="helfen")     L.push([m.figuren,"Hilfe-Marker (je einer pro Spieler, einmal pro Spiel einsetzbar)"]);
  if(wahl.ziel==="sammeln")     L.push([40,`Sammelteile „${t.bonus}“ (Muggelsteine, Bohnen oder Papierschnipsel)`]);
  L.push([1,"Regelheft, handgeschrieben — höchstens eine Seite"]);
  return L;
}

function regeln(){
  const t=THEMEN[wahl.thema], m=MASSE[wahl.groesse], R=[];
  const zielText={
    rennen:`Alle starten auf dem grünen Feld. Wer als Erster ${t.zielAkk} erreicht, gewinnt.`,
    sammeln:`Sammelt so viele ${t.bonus} wie möglich. Wer am Ende die meisten hat, gewinnt.`,
    fangen:`Eine Spielerin ist ${t.feindNom} und jagt die anderen. Wer gefangen wird, scheidet aus — oder wird selbst zur Jägerin. Sucht euch eine Variante aus!`,
    zusammen:`Ihr spielt alle gemeinsam gegen das Spiel. Ihr gewinnt nur, wenn ihr es alle ${t.zielDat} schafft, bevor die Zeit um ist.`
  }[wahl.ziel];
  R.push(["Ziel des Spiels",zielText]);
  R.push(["Wenn du dran bist",ZUGREGEL[wahl.mechanik][wahl.glueck]]);
  const trickText={
    falle:`Wer auf einem roten Feld landet, gerät in den ${t.falle}: eine Runde aussetzen — oder drei Felder zurück, sucht euch eine Variante aus und schreibt sie auf.`,
    abkuerzung:`Zwei Felder sind durch eine Abkürzung verbunden. Wer sie nimmt, spart viel Weg — muss aber vorher eine 6 würfeln oder eine Karte abgeben. Riskant!`,
    tausch:`Landest du auf demselben Feld wie jemand anders, darfst du ihm ein Teil wegnehmen („${t.tausch}“). Pro Zug nur einmal.`,
    bonus:`Es gibt Bonus-Karten („${t.bonus}“). Wer eine bekommt, legt sie offen vor sich hin und darf ihre Kraft einmal im Spiel benutzen.`,
    zeitdruck:`Sobald du dran bist, wird die Sanduhr umgedreht. Was du in 30 Sekunden nicht geschafft hast, ist verfallen.`,
    helfen:`Ihr dürft euch gegenseitig helfen: Steckt jemand fest, darf ein anderer seinen Zug abgeben, um ihn zu befreien. Jeder Spieler darf das nur einmal pro Spiel.`
  }[wahl.trick];
  R.push(["Dein besonderer Trick",trickText]);
  const endeText={
    rennen:`Sobald jemand ${t.zielAkk} erreicht, ist das Spiel sofort zu Ende.`,
    sammeln:`Das Spiel endet, wenn der Nachziehstapel leer ist. Dann zählen alle ihre ${t.bonus}.`,
    fangen:`Das Spiel endet, wenn nur noch eine Spielerin übrig ist — oder wenn alle gefangen wurden.`,
    zusammen:`Das Spiel endet, wenn ihr es alle geschafft habt (gewonnen) oder wenn die Zeit abgelaufen ist (verloren).`
  }[wahl.ziel];
  R.push(["Wann ist Schluss",endeText]);
  R.push(["Spieler und Dauer",`Für ${m.spieler} Spieler, ungefähr ${m.dauer} Minuten.`]);
  return R;
}

function bastelSchritte(){
  const t=THEMEN[wahl.thema], m=MASSE[wahl.groesse];
  const S=[];
  if(wahl.feld!=="kein"){
    S.push(`Zeichne den Spielplan mit Bleistift auf Pappe — erst die Form, dann die ${m.felder} Felder. Noch nicht anmalen!`);
    S.push(`Markiere das Startfeld grün.` + (wahl.trick==="falle"?` Male jedes fünfte Feld rot an — das sind die Fallen.`:"") + (wahl.trick==="abkuerzung"?` Zeichne zwei Abkürzungen als Brücken quer über den Plan.`:""));
  } else {
    S.push(`Schneide ${m.karten} gleich große Karten aus Pappe. Alle müssen exakt gleich aussehen, wenn sie verdeckt liegen.`);
  }
  S.push(`Bastle ${m.figuren} Figuren („${t.figur}“). Wichtig: Sie müssen auf ein Feld passen und von oben gut zu unterscheiden sein.`);
  if(wahl.mechanik==="karte") S.push(`Beschrifte die ${m.karten} Karten mit Bleistift. Noch nicht mit Filzstift — du wirst sie beim Testen bestimmt ändern.`);
  if(wahl.mechanik==="setzen") S.push(`Schneide ${m.plaettchen} Plättchen aus und teile sie in Spielerfarben auf.`);
  S.push(`Schreibe die Regeln auf ein einziges Blatt. Test: Kann jemand, der dein Spiel nicht kennt, es nur mit dem Blatt spielen?`);
  S.push(`Erst wenn alles funktioniert: anmalen in ${t.farben}. Vorher wäre es Verschwendung.`);
  return S;
}

function stellschrauben(){
  const m=MASSE[wahl.groesse], S=[];
  const mehr={wuerfel:"ein Würfel mehr",karte:"eine Karte mehr auf der Hand",
              setzen:"ein Plättchen mehr zur Auswahl",geschick:"ein Versuch mehr"}[wahl.mechanik];
  const weniger={wuerfel:"ein Würfel weniger",karte:"eine Karte weniger auf der Hand",
              setzen:"ein Plättchen weniger zur Auswahl",geschick:"ein Versuch weniger"}[wahl.mechanik];
  if(wahl.feld==="kein"){
    S.push(`<b>Dauert zu lange?</b> Nimm ${Math.round(m.karten*0.3)} Karten aus dem Stapel.`);
    S.push(`<b>Zu schnell vorbei?</b> Lege ${Math.round(m.karten*0.3)} Karten dazu.`);
  } else {
    S.push(`<b>Dauert zu lange?</b> Nimm ${Math.round(m.felder*0.25)} Felder weg.`);
    S.push(`<b>Zu schnell vorbei?</b> Baue ${Math.round(m.felder*0.25)} Felder dazu — oder lasst alle zweimal herumlaufen.`);
  }
  if(wahl.glueck==="viel") S.push(`<b>Immer gewinnt derselbe?</b> Bei einem Glücksspiel ist das wirklich Zufall. Spielt drei Runden hintereinander und zählt zusammen.`);
  if(wahl.glueck==="koennen") S.push(`<b>Ein Kind gewinnt immer?</b> Gib den anderen einen Vorsprung von drei Feldern. Das nennt man Handicap — und es ist keine Schummelei, sondern gutes Design.`);
  if(wahl.glueck==="misch") S.push(`<b>Zu viel Glück?</b> Gib mehr Auswahl: ${mehr}. <b>Zu wenig Glück?</b> Weniger Auswahl: ${weniger}.`);
  if(wahl.trick==="falle") S.push(`<b>Fallen zu gemein?</b> Statt aussetzen nur ein Feld zurück. Testet beides und entscheidet euch.`);
  if(wahl.trick==="zeitdruck") S.push(`<b>Sanduhr zu hektisch?</b> Nimm eine Minute statt 30 Sekunden — oder lass die Sanduhr erst ab der zweiten Runde laufen.`);
  S.push(`<b>Jemand langweilt sich, wenn er nicht dran ist?</b> Gib ihm eine Aufgabe: mitzählen, Karten umdrehen, auf die Zeit achten.`);
  return S;
}

function spielName(){
  const t=THEMEN[wahl.thema];
  return {
    rennen:`Wettlauf ${t.zielDat}`,
    sammeln:`${t.bonus}-Jagd`,
    fangen:`Flucht vor ${t.feindDat}`,
    zusammen:`Rettet ${t.zielAkk}!`
  }[wahl.ziel];
}

function zeigeBauplan(){
  document.getElementById("frage").style.display="none";
  const t=THEMEN[wahl.thema];
  const el=document.getElementById("bauplan");
  el.classList.add("an");
  el.innerHTML=`
  <div class="plan-kopf">
    <div class="stempel">Bauplan · fertig zum Basteln</div>
    <input class="namensfeld" id="spielname" value="${spielName()}" aria-label="Name deines Spiels">
    <input class="erfinder" placeholder="Erfunden von …" aria-label="Erfunden von">
  </div>

  <div class="bloecke">
    <div class="block weit">
      <h3><span class="pille" style="background:var(--teal-bg);color:var(--teal)">Spielplan</span> So sieht dein Feld aus</h3>
      <div class="brett-huelle">${brettSVG()}</div>
      <p class="brett-bei">Grün = Start${wahl.trick==="falle"?" · Rot = Falle":""}${wahl.trick==="abkuerzung"?" · Gelb = Abkürzung":""}. Übertrage das mit Bleistift auf Pappe.</p>
    </div>

    <div class="block">
      <h3><span class="pille" style="background:var(--rot-bg);color:var(--rot)">Material</span> Das brauchst du</h3>
      <ul class="liste">${material().map(([n,x])=>`<li><span class="menge">${n}×</span><span>${x}</span></li>`).join("")}</ul>
    </div>

    <div class="block">
      <h3><span class="pille" style="background:var(--gelb-bg);color:var(--gelb)">Bauen</span> In dieser Reihenfolge</h3>
      <ol class="schritte">${bastelSchritte().map(s=>`<li>${s}</li>`).join("")}</ol>
    </div>

    <div class="block weit">
      <h3><span class="pille" style="background:var(--lila-bg);color:var(--lila)">Regeln</span> Dein Regelheft</h3>
      ${regeln().map(([k,v])=>`<div class="regel"><span class="regel-titel">${k}</span><p>${v}</p></div>`).join("")}
    </div>

    <div class="block weit">
      <h3><span class="pille" style="background:var(--gelb-bg);color:var(--gelb)">Stellschrauben</span> Wenn etwas nicht stimmt</h3>
      <ul class="liste">${stellschrauben().map(s=>`<li><span class="stellschraube">${s}</span></li>`).join("")}</ul>
    </div>
  </div>

  <div class="testauftrag">
    <h3>Dein Testauftrag</h3>
    <p>Lass zwei Kinder dein Spiel spielen, die es noch nicht kennen. <strong>Du darfst nichts erklären
    und nichts verteidigen</strong> — nur zusehen und aufschreiben, wo sie stocken. Wenn sie die Regel
    nicht verstehen, ist die Regel schuld, nicht die Spieler.</p>
    <p style="margin-top:10px">Danach änderst du <strong>genau eine Sache</strong> und testest noch einmal.</p>
  </div>

  <div class="fuss-steuer nodruck">
    <button class="knopf stark" id="nochmal">Noch ein Spiel bauen</button>
    <button class="knopf" id="aendern">Letzte Entscheidung ändern</button>
    <span>Zum Ausdrucken: ⌘/Strg + P</span>
  </div>`;

  document.getElementById("nochmal").addEventListener("click",()=>{
    Object.keys(wahl).forEach(k=>delete wahl[k]);
    schrittNr=0;
    el.classList.remove("an"); el.innerHTML="";
    document.getElementById("frage").style.display="";
    zeichneFrage(); window.scrollTo({top:0,behavior:"smooth"});
  });
  document.getElementById("aendern").addEventListener("click",()=>{
    schrittNr=SCHRITTE.length-1;
    el.classList.remove("an"); el.innerHTML="";
    document.getElementById("frage").style.display="";
    zeichneFrage(); window.scrollTo({top:0,behavior:"smooth"});
  });
  zeichneBauleiste();
  window.scrollTo({top:0,behavior:"smooth"});
}

zeichneFrage();
</script>
