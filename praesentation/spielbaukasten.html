<title>Der Spiele-Baukasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFCF5; --karte:#FFFFFF; --karte-2:#FBF6EA;
  --tinte:#221F2B; --tinte-weich:#5E5866; --tinte-blass:#948D9C;
  --linie:#E4DCCB;
  --rot:#DB4A24; --teal:#1E7A72; --gelb:#E8A600; --lila:#6B4E9E;
  --rot-bg:#FBE7E0; --teal-bg:#DEEEEC; --gelb-bg:#FBF0D5; --lila-bg:#EBE5F5;
  --erzaehler-bg:#221F2B; --erzaehler-tinte:#FFF9EC;
  --schatten:0 2px 0 var(--linie),0 10px 24px -14px rgba(34,31,43,.4);
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --text:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16151C; --karte:#1E1D26; --karte-2:#25232E;
  --tinte:#F2EFE8; --tinte-weich:#ACA6B4; --tinte-blass:#7B7585;
  --linie:#332F3D;
  --rot:#FF8259; --teal:#5CC0B5; --gelb:#F5C43F; --lila:#AE93E0;
  --rot-bg:#33201A; --teal-bg:#13302D; --gelb-bg:#33280E; --lila-bg:#251E33;
  --erzaehler-bg:#2A2635; --erzaehler-tinte:#FFF9EC;
  --schatten:0 2px 0 var(--linie),0 12px 28px -16px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#16151C; --karte:#1E1D26; --karte-2:#25232E;
  --tinte:#F2EFE8; --tinte-weich:#ACA6B4; --tinte-blass:#7B7585;
  --linie:#332F3D;
  --rot:#FF8259; --teal:#5CC0B5; --gelb:#F5C43F; --lila:#AE93E0;
  --rot-bg:#33201A; --teal-bg:#13302D; --gelb-bg:#33280E; --lila-bg:#251E33;
  --erzaehler-bg:#2A2635; --erzaehler-tinte:#FFF9EC;
  --schatten:0 2px 0 var(--linie),0 12px 28px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tinte);font-family:var(--text);font-size:17px;line-height:1.6;margin:0;padding:0 18px 70px;-webkit-font-smoothing:antialiased}
.huelle{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}

header{padding:28px 0 16px;display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;flex:none}
header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
header p{font-size:.9rem;color:var(--tinte-weich)}

/* Erzähler */
.erzaehler{
  background:var(--erzaehler-bg);color:var(--erzaehler-tinte);border-radius:18px;
  padding:22px 26px 24px;box-shadow:var(--schatten);position:relative;margin-bottom:14px;
}
.erzaehler::after{content:"";position:absolute;left:44px;bottom:-13px;width:26px;height:14px;
  background:var(--erzaehler-bg);clip-path:polygon(0 0,100% 0,30% 100%)}
.erzaehler .kopf{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;opacity:.55;margin-bottom:10px}
.satz{font-family:var(--display);font-size:clamp(1.05rem,2.4vw,1.32rem);font-weight:600;line-height:1.45;margin-bottom:7px;animation:auf .5s ease both}
.satz:last-child{margin-bottom:0}
.satz.neu{color:var(--gelb)}
@keyframes auf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.chip{font-size:.76rem;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--karte);border:1.5px solid var(--linie);color:var(--tinte-weich)}

/* Frage */
.frage-karte{background:var(--karte);border:2px solid var(--linie);border-radius:18px;padding:26px 26px 30px;box-shadow:var(--schatten)}
.schritt-zahl{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tinte-blass)}
.frage-karte h2{font-size:clamp(1.55rem,4.4vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.unterfrage{color:var(--tinte-weich);font-size:1rem;max-width:56ch}
.optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:13px;margin-top:24px}
.opt{
  text-align:left;cursor:pointer;background:var(--karte-2);border:2px solid var(--linie);
  border-radius:15px;padding:0 0 16px;color:inherit;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease;
}
.opt:hover{transform:translateY(-4px) rotate(-.5deg);border-color:var(--tinte-blass)}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.opt.gewaehlt{border-color:var(--teal)}
.portrait{width:100%;height:132px;display:block;background:#F4EFE2}
.opt-text{padding:13px 16px 0;display:flex;flex-direction:column;gap:5px}
.opt .sym{font-size:1.45rem;line-height:1;padding:14px 16px 0}
.opt .titel{font-family:var(--display);font-size:1.2rem;font-weight:700;line-height:1.15}
.opt .info{font-size:.92rem;color:var(--tinte-weich);line-height:1.44}
.opt .mini{font-family:var(--mono);font-size:.68rem;letter-spacing:.03em;color:var(--tinte-blass);margin-top:4px;line-height:1.4}
.steuer{display:flex;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap}
.knopf{cursor:pointer;border-radius:11px;padding:11px 20px;font-weight:800;font-size:.96rem;border:2px solid var(--linie);background:var(--karte);color:var(--tinte)}
.knopf:hover{border-color:var(--tinte-blass)}
.knopf:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.knopf.stark{background:var(--rot);border-color:var(--rot);color:#FFF9EC}
.fortschritt{flex:1;min-width:130px;height:9px;border-radius:99px;background:var(--linie);overflow:hidden}
.fortschritt i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s ease}

/* Bauplan */
.bauplan{display:none}
.bauplan.an{display:block}
.plan-kopf{background:var(--karte);border:2px solid var(--linie);border-radius:18px;padding:24px 26px;box-shadow:var(--schatten);margin-bottom:16px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.plan-kopf .held{width:104px;height:104px;border-radius:14px;background:#F4EFE2;flex:none}
.plan-kopf .txt{flex:1;min-width:240px}
.stempel{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rot);font-weight:600}
.namensfeld{font-family:var(--display);font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:800;letter-spacing:-.02em;background:transparent;border:0;border-bottom:3px dashed var(--linie);color:var(--tinte);width:100%;padding:4px 0;margin:6px 0 4px}
.namensfeld:focus{outline:0;border-bottom-color:var(--rot)}
.erfinder{font-family:var(--text);font-size:.96rem;background:transparent;border:0;border-bottom:2px dashed var(--linie);color:var(--tinte-weich);padding:3px 0;width:min(100%,320px)}
.erfinder:focus{outline:0;border-bottom-color:var(--rot)}

.bloecke{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.block{background:var(--karte);border:2px solid var(--linie);border-radius:18px;padding:22px 24px 24px}
.block.weit{grid-column:1/-1}
.block h3{font-size:1.24rem;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.pille{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:99px}
.geschichte{background:var(--gelb-bg);border:2px solid var(--gelb);border-radius:18px;padding:24px 26px;margin-bottom:16px}
.geschichte h3{color:var(--tinte)}
.geschichte p{font-family:var(--display);font-size:1.12rem;font-weight:600;line-height:1.5}
.geschichte p + p{margin-top:9px}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.liste li{display:flex;gap:11px;align-items:baseline;font-size:.97rem}
.menge{font-family:var(--mono);font-weight:600;font-size:.87rem;color:var(--rot);min-width:2.6em;flex:none;font-variant-numeric:tabular-nums}
ol.schritte{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:10px;font-size:.97rem}
.regel{padding:11px 0;border-bottom:1px dashed var(--linie)}
.regel:last-child{border-bottom:0}
.regel-titel{font-family:var(--display);font-weight:700;font-size:1rem;display:block;margin-bottom:2px}
.regel p{font-size:.97rem;color:var(--tinte-weich)}
.spruch{background:var(--karte-2);border:2px solid var(--linie);border-radius:10px;padding:11px 14px;font-family:var(--display);font-weight:600;font-size:.98rem}
.spruchliste{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.brett-huelle{background:var(--karte-2);border-radius:14px;padding:16px;overflow-x:auto}
.brett-huelle svg{display:block;margin:0 auto;max-width:100%;height:auto}
.brett-huelle svg rect,.brett-huelle svg ellipse{stroke:var(--tinte);stroke-width:1.8}
.brett-huelle svg .fn{fill:var(--karte)}
.brett-huelle svg .fs{fill:var(--teal)}
.brett-huelle svg .ff{fill:var(--rot)}
.brett-huelle svg .fa{fill:var(--gelb)}
.brett-huelle svg .stapel{fill:var(--karte-2);stroke-dasharray:6 5;stroke-width:2}
.brett-huelle svg .fuehrung{fill:none;stroke:var(--linie);stroke-width:2;stroke-dasharray:5 6}
.brett-huelle svg .verbinder{fill:none;stroke:var(--linie);stroke-width:3}
.brett-huelle svg .bt{font-family:var(--display);font-size:20px;font-weight:800;fill:var(--tinte)}
.brett-huelle svg .bs{font-family:var(--text);font-size:13px;fill:var(--tinte-weich)}
.brett-bei{font-size:.85rem;color:var(--tinte-blass);margin-top:10px;text-align:center}
.stellschraube{background:var(--gelb-bg);border-left:4px solid var(--gelb);border-radius:0 8px 8px 0;padding:11px 15px;font-size:.94rem}
.testauftrag{background:var(--lila-bg);border:2px dashed var(--lila);border-radius:18px;padding:20px 24px;margin-top:16px}
.testauftrag h3{color:var(--lila);margin-bottom:8px}
.fuss-steuer{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.fuss-steuer span{font-size:.87rem;color:var(--tinte-blass)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .nodruck,header,.chips{display:none!important}
  .block,.plan-kopf,.geschichte{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .bloecke{display:block}
  .block{margin-bottom:12px}
}
</style>

<div class="huelle">

<header class="nodruck">
  <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
    <rect x="4" y="15" width="24" height="24" rx="5" fill="#E8A600" stroke="#221F2B" stroke-width="2.6"/>
    <circle cx="12" cy="23" r="2.2" fill="#221F2B"/><circle cx="20" cy="31" r="2.2" fill="#221F2B"/>
    <path d="M24 4 L40 4 L40 20 Z" fill="#1E7A72" stroke="#221F2B" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>
  <div>
    <h1>Der Spiele-Baukasten</h1>
    <p>Sieben Entscheidungen — und deine Geschichte wird ein Spiel.</p>
  </div>

<div class="erzaehler nodruck" id="erzaehler" aria-live="polite"></div>
<div class="chips nodruck" id="chips"></div>

<main>
  <div class="frage-karte nodruck" id="frage"></div>
  <div class="bauplan" id="bauplan"></div>
</main>

</div>
<script>

const P = {

const wahl = {};
let schrittNr = 0;
const saetze = [];

function optionenFuer(s){
  if(s.key==="feld")     return s.optionen.filter(o=>o.wenn.includes(wahl.ziel));
  if(s.key==="mechanik") return s.optionen.filter(o=>o.wenn.includes(wahl.feld));
  return s.optionen.filter(o=>
    (!o.wenn_ziel || o.wenn_ziel.includes(wahl.ziel)) &&
    (!o.wenn_feld || o.wenn_feld.includes(wahl.feld)));
}

/* ============ Der Erzähler ============ */
function erzaehle(key){
  const w = WELTEN[wahl.welt], m = MASSE[wahl.groesse];
  if(key==="welt") return WELTEN[wahl.welt].intro;
  if(key==="ziel") return [{
    rennen:`Und dann geht es los: ${w.held1} muss vor allen anderen ${w.zielAkk} erreichen.`,
    sammeln:`Überall liegen ${w.bonus} herum. Wer am Ende die meisten hat, gewinnt.`,
    fangen:`Und mittendrin lauert ${w.boeseNom}. Wer erwischt wird, ist raus.`,
    zusammen:`Alleine schafft das niemand. Entweder ihr kommt alle ${w.zielDat} — oder keiner.`
  }[wahl.ziel]];
  if(key==="feld") return [{
    rundkurs:`Der Weg führt einmal rundherum, ${w.wegBild}.`,
    raster:`Alles spielt auf einem großen Karo-Feld: ${w.wegBild}.`,
    pfad:`Der Weg gabelt sich immer wieder — ${w.wegBild}.`,
    kein:`Kein Spielbrett. Die ganze Geschichte passt auf einen Stapel Karten.`
  }[wahl.feld]];
  if(key==="mechanik") return [{
    wuerfel:"Wer dran ist, würfelt und zieht los.",
    karte:"Wer dran ist, spielt eine Karte aus. Und keiner weiß vorher, was kommt.",
    setzen:"Wer dran ist, legt ein Plättchen. Einmal gelegt, bleibt es liegen.",
    geschick:"Wer dran ist, muss treffen. Ruhige Hand, tief durchatmen."
  }[wahl.mechanik]];
  if(key==="glueck") return [{
    viel:"Das Glück entscheidet fast alles. Das macht laut und lustig.",
    misch:"Glück hilft. Aber wer klug überlegt, hilft sich mehr.",
    koennen:"Hier gewinnt niemand aus Versehen. Nur wer vorausdenkt."
  }[wahl.glueck]];
  if(key==="trick") return [{
    falle:`Aber Vorsicht: ${w.falleSatz}`,
    abkuerzung:"Und es gibt eine Abkürzung. Schneller — und gefährlicher.",
    tausch:`Und man darf klauen. ${w.tauschSatz}`,
    bonus:`Wer ${w.bonus} findet, bekommt eine Extra-Kraft. Einmal im Spiel.`,
    zeitdruck:"Und die Zeit läuft. Dreißig Sekunden, dann ist der Nächste dran.",
    helfen:"Aber ihr dürft euch gegenseitig retten. Einmal, jeder."
  }[wahl.trick]];
  if(key==="groesse") return [`Am Ende passt alles auf einen Tisch: für ${m.spieler} Spieler, ungefähr ${m.dauer} Minuten.`,"Und jetzt wird gebaut."];
  return [];
}
function zeichneErzaehler(){
  const el=document.getElementById("erzaehler");
  if(!saetze.length){
    el.innerHTML=`<div class="kopf">Deine Geschichte</div>
      <p class="satz">Es war einmal … na ja. Das entscheidest du gleich selbst.</p>`;
    return;
  }
  el.innerHTML=`<div class="kopf">Deine Geschichte</div>`+
    saetze.map((s,i)=>`<p class="satz${i>=saetze.laenge0?" neu":""}">${s}</p>`).join("");
}
function zeichneChips(){
  const el=document.getElementById("chips");
  el.innerHTML=SCHRITTE.filter(s=>wahl[s.key]!==undefined).map(s=>{
    const o=s.optionen.find(o=>o.id===wahl[s.key]);
    return `<span class="chip">${o.sym?o.sym+" ":""}${o.titel}</span>`;
  }).join("");
}

/* ============ Frage ============ */
function zeichneFrage(){
  const wrap=document.getElementById("frage");
  if(schrittNr>=SCHRITTE.length){ zeigeBauplan(); return; }
  wrap.style.display="";
  const s=SCHRITTE[schrittNr], opts=optionenFuer(s);
  wrap.innerHTML=`
    <div class="schritt-zahl">Schritt ${schrittNr+1} von ${SCHRITTE.length}</div>
    <h2>${s.frage}</h2>
    <p class="unterfrage">${s.unter}</p>
    <div class="optionen">
      ${opts.map(o=>`<button class="opt ${wahl[s.key]===o.id?"gewaehlt":""}" data-id="${o.id}">
        ${s.key==="welt" ? held(o.id) : `<span class="sym" aria-hidden="true">${o.sym}</span>`}
        <span class="opt-text">
          <span class="titel">${o.titel}</span>
          <span class="info">${o.info}</span>
          ${o.mini?`<span class="mini">${o.mini}</span>`:""}
        </span>
      </button>`).join("")}
    </div>
    <div class="steuer">
      ${schrittNr>0?'<button class="knopf" id="zurueck">← Zurück</button>':""}
      <div class="fortschritt"><i style="width:${(schrittNr/SCHRITTE.length)*100}%"></i></div>
    </div>`;
  wrap.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    wahl[s.key]=b.dataset.id;
    SCHRITTE.slice(schrittNr+1).forEach(sp=>{
      if(wahl[sp.key]!==undefined && !optionenFuer(sp).some(o=>o.id===wahl[sp.key])) delete wahl[sp.key];
    });
    saetze.laenge0=saetze.length;
    erzaehle(s.key).forEach(x=>saetze.push(x));
    schrittNr++;
    zeichneErzaehler(); zeichneChips(); zeichneFrage();
    window.scrollTo({top:0,behavior:"smooth"});
  }));
  const z=document.getElementById("zurueck");
  if(z) z.addEventListener("click",()=>{
    schrittNr--;
    const s2=SCHRITTE[schrittNr];
    saetze.length=Math.max(0,saetze.length-erzaehle(s2.key).length);
    delete wahl[s2.key];
    saetze.laenge0=saetze.length;
    zeichneErzaehler(); zeichneChips(); zeichneFrage();
  });
}

<script>
/* ============ Spielbrett ============ */
function brettSVG(){
  const m=MASSE[wahl.groesse], n=m.felder, sonder={};
  if(wahl.trick==="falle") for(let i=4;i<n;i+=5) sonder[i]="ff";
  if(wahl.trick==="abkuerzung"){ sonder[Math.round(n*0.25)]="fa"; sonder[Math.round(n*0.7)]="fa"; }
  const kl = i => i===0 ? "fs" : (sonder[i] || "fn");

  if(wahl.feld==="rundkurs"){
    const w=460,h=340,cx=230,cy=170,rx=178,ry=126,s=22;
    let out=`<ellipse class="fuehrung" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+(i/n)*2*Math.PI;
      out+=`<rect class="${kl(i)}" x="${(cx+rx*Math.cos(a)-s/2).toFixed(1)}" y="${(cy+ry*Math.sin(a)-s/2).toFixed(1)}" width="${s}" height="${s}" rx="4"/>`;
    }
    out+=`<text class="bt" x="${cx}" y="${cy-4}" text-anchor="middle">${n} Felder</text>`
       + `<text class="bs" x="${cx}" y="${cy+18}" text-anchor="middle">im Kreis</text>`;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Rundkurs mit ${n} Feldern">${out}</svg>`;
  }
  if(wahl.feld==="raster"){
    const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), c=44, g=5, pad=12;
    const w=pad*2+cols*c+(cols-1)*g, h=pad*2+rows*c+(rows-1)*g;
    let out="", i=0;
    for(let r=0;r<rows;r++){ for(let k=0;k<cols;k++){ if(i>=n) break;
      out+=`<rect class="${kl(i)}" x="${pad+k*(c+g)}" y="${pad+r*(c+g)}" width="${c}" height="${c}" rx="6"/>`; i++; }}
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Karo-Feld mit ${n} Kästchen">${out}</svg>`;
  }
  if(wahl.feld==="pfad"){
    const cols=8, rows=Math.ceil(n/cols), c=40, g=12, pad=14;
    const w=pad*2+cols*c+(cols-1)*g, h=pad*2+rows*c+(rows-1)*g;
    let out="", i=0, punkte=[];
    for(let r=0;r<rows;r++){ for(let k=0;k<cols;k++){ if(i>=n) break;
      const kk = r%2===0 ? k : cols-1-k, x=pad+kk*(c+g), y=pad+r*(c+g);
      punkte.push([x+c/2,y+c/2]);
      out+=`<rect class="${kl(i)}" x="${x}" y="${y}" width="${c}" height="${c}" rx="8"/>`; i++; }}
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Weg mit ${n} Feldern"><path class="verbinder" d="${punkte.map((p,j)=>(j?"L":"M")+p[0]+" "+p[1]).join(" ")}"/>${out}</svg>`;
  }
  let out=`<rect class="stapel" x="20" y="34" width="86" height="124" rx="8"/>`
    + `<text class="bs" x="63" y="100" text-anchor="middle">Nachzieh-</text>`
    + `<text class="bs" x="63" y="118" text-anchor="middle">stapel</text>`;
  for(let i=0;i<4;i++) out+=`<rect class="${i===0?"fs":"fn"}" x="${140+i*78}" y="34" width="66" height="124" rx="8"/>`;
  out+=`<text class="bs" x="230" y="188" text-anchor="middle">4 offene Karten in der Tischmitte</text>`;
  return `<svg viewBox="0 0 460 204" width="460" role="img" aria-label="Kartenauslage ohne Spielbrett">${out}</svg>`;
}

/* ============ Inhalte des Bauplans ============ */
function material(){
  const m=MASSE[wahl.groesse], w=WELTEN[wahl.welt], L=[];
  const brett={rundkurs:`Spielplan aus Pappe (A3): ${m.felder} Felder im Kreis`,
    raster:`Spielplan aus Pappe (A3): Karo-Feld mit ${m.felder} Kästchen`,
    pfad:`Spielplan aus Pappe (A3): ein Weg mit ${m.felder} Feldern und zwei Gabelungen`,
    kein:`kein Spielplan nötig — alles passiert auf dem Tisch`}[wahl.feld];
  L.push([1,brett]);
  L.push([m.figuren,`Figuren („${w.held1}“ und die anderen) — aus Flaschendeckeln, Korken oder Pappe mit Fuß`]);
  if(wahl.mechanik==="wuerfel") L.push([wahl.glueck==="viel"?1:(wahl.glueck==="misch"?2:3),"Würfel"]);
  if(wahl.mechanik==="karte")   L.push([m.karten,"Blanko-Karten für den Nachziehstapel"]);
  if(wahl.mechanik==="setzen")  L.push([m.plaettchen,"Plättchen aus Pappe (etwa 3 × 3 cm), in Spielerfarben"]);
  if(wahl.mechanik==="geschick")L.push([m.figuren,"flache Scheiben zum Schnippen (Knöpfe oder Deckel)"]);
  if(wahl.trick==="falle")      L.push([Math.floor(m.felder/5),`Fallen-Felder („${w.falle}“) — rot anmalen`]);
  if(wahl.trick==="bonus")      L.push([Math.max(6,Math.round(m.karten/2)),`Extra-Kraft-Karten („${w.bonus}“)`]);
  if(wahl.trick==="abkuerzung") L.push([2,"Abkürzungen — mit dickem Stift als Brücke einzeichnen"]);
  if(wahl.trick==="tausch")     L.push([1,`Merkzettel für die Klau-Regel („${w.tausch}“)`]);
  if(wahl.trick==="zeitdruck")  L.push([1,"Sanduhr (30 Sekunden) oder ein Timer"]);
  if(wahl.trick==="helfen")     L.push([m.figuren,"Rettungs-Marker, einer pro Spieler"]);
  if(wahl.ziel==="sammeln")     L.push([40,`Sammelteile („${w.bonus}“) — Muggelsteine, Bohnen oder Papierschnipsel`]);
  L.push([1,"Regelheft, handgeschrieben — höchstens eine Seite"]);
  return L;
}
function regeln(){
  const w=WELTEN[wahl.welt], m=MASSE[wahl.groesse], R=[];
  R.push(["Darum geht es",{
    rennen:`Alle starten auf dem grünen Feld. Wer als Erster ${w.zielAkk} erreicht, gewinnt.`,
    sammeln:`Sammelt so viele ${w.bonus} wie möglich. Wer am Ende die meisten hat, gewinnt.`,
    fangen:`Einer von euch ist ${w.boeseNom} und jagt die anderen. Wer gefangen wird, scheidet aus — oder wird selbst zum Jäger. Sucht euch eine Variante aus und schreibt sie auf.`,
    zusammen:`Ihr spielt gemeinsam gegen das Spiel. Ihr gewinnt nur, wenn ihr es alle ${w.zielDat} schafft, bevor die Zeit um ist.`
  }[wahl.ziel]]);
  R.push(["Wenn du dran bist",ZUGREGEL[wahl.mechanik][wahl.glueck]]);
  R.push(["Der Trick",{
    falle:`${w.falleSatz} Wer auf einem roten Feld landet, setzt eine Runde aus — oder geht drei Felder zurück. Testet beides und entscheidet euch für eine Regel.`,
    abkuerzung:`Zwei Felder sind durch eine Abkürzung verbunden. Wer sie nimmt, spart viel Weg — muss aber vorher eine 6 würfeln oder eine Karte abgeben.`,
    tausch:`${w.tauschSatz} Wer auf demselben Feld landet wie ein anderer, darf ihm ein Teil abnehmen. Nur einmal pro Zug!`,
    bonus:`Wer eine Extra-Kraft-Karte („${w.bonus}“) bekommt, legt sie offen vor sich hin und darf sie einmal im Spiel benutzen.`,
    zeitdruck:`Sobald du dran bist, wird die Sanduhr umgedreht. Was du in dreißig Sekunden nicht geschafft hast, ist weg.`,
    helfen:`Steckt jemand fest, darf ein anderer seinen ganzen Zug abgeben, um ihn zu befreien. Jeder darf das nur einmal pro Spiel.`
  }[wahl.trick]]);
  R.push(["Wann ist Schluss",{
    rennen:`Sobald jemand ${w.zielAkk} erreicht, ist sofort Schluss.`,
    sammeln:`Wenn der Nachziehstapel leer ist. Dann zählen alle ihre ${w.bonus}.`,
    fangen:`Wenn nur noch einer übrig ist — oder wenn alle gefangen wurden.`,
    zusammen:`Wenn ihr es alle geschafft habt (gewonnen) oder wenn die Zeit abgelaufen ist (verloren).`
  }[wahl.ziel]]);
  R.push(["Für wen",`${m.spieler} Spieler, ungefähr ${m.dauer} Minuten.`]);
  return R;
}
function bastelSchritte(){
  const w=WELTEN[wahl.welt], m=MASSE[wahl.groesse], S=[];
  if(wahl.feld!=="kein"){
    S.push(`Zeichne den Spielplan mit <strong>Bleistift</strong> auf Pappe — erst die Form, dann die ${m.felder} Felder. Noch nicht anmalen!`);
    S.push(`Male das Startfeld grün an.`+(wahl.trick==="falle"?` Jedes fünfte Feld wird rot — das sind die ${w.falle}n.`:"")+(wahl.trick==="abkuerzung"?` Zeichne zwei Abkürzungen als Brücken quer über den Plan.`:""));
  } else {
    S.push(`Schneide ${m.karten} gleich große Karten aus Pappe. Wichtig: Von hinten müssen alle exakt gleich aussehen.`);
  }
  S.push(`Bastle ${m.figuren} Figuren. Eine davon ist ${w.heldLang}. Sie müssen auf ein Feld passen und von oben gut zu unterscheiden sein.`);
  if(wahl.mechanik==="karte") S.push(`Beschrifte die ${m.karten} Karten mit Bleistift. Nimm die Sprüche von unten oder erfinde eigene.`);
  if(wahl.mechanik==="setzen") S.push(`Schneide ${m.plaettchen} Plättchen aus und teile sie in Spielerfarben auf.`);
  S.push(`Schreib die Regeln auf <strong>ein</strong> Blatt. Test: Kann jemand, der dein Spiel nicht kennt, nur mit diesem Blatt spielen?`);
  S.push(`Und erst jetzt, wenn alles funktioniert: anmalen in ${w.farben}. Vorher wäre es Verschwendung.`);
  return S;
}
function stellschrauben(){
  const m=MASSE[wahl.groesse], S=[];
  const mehr={wuerfel:"ein Würfel mehr",karte:"eine Karte mehr auf der Hand",setzen:"ein Plättchen mehr zur Auswahl",geschick:"ein Versuch mehr"}[wahl.mechanik];
  const wen={wuerfel:"ein Würfel weniger",karte:"eine Karte weniger",setzen:"ein Plättchen weniger",geschick:"ein Versuch weniger"}[wahl.mechanik];
  if(wahl.feld==="kein"){
    S.push(`<b>Dauert zu lange?</b> Nimm ${Math.round(m.karten*0.3)} Karten raus.`);
    S.push(`<b>Zu schnell vorbei?</b> Leg ${Math.round(m.karten*0.3)} Karten dazu.`);
  } else {
    S.push(`<b>Dauert zu lange?</b> Nimm ${Math.round(m.felder*0.25)} Felder weg.`);
    S.push(`<b>Zu schnell vorbei?</b> Bau ${Math.round(m.felder*0.25)} Felder dazu — oder lasst alle zweimal herumlaufen.`);
  }
  if(wahl.glueck==="viel") S.push(`<b>Immer gewinnt derselbe?</b> Bei einem Glücksspiel ist das wirklich Zufall. Spielt drei Runden und zählt zusammen.`);
  if(wahl.glueck==="koennen") S.push(`<b>Einer gewinnt immer?</b> Gib den anderen drei Felder Vorsprung. Das heißt Handicap und ist keine Schummelei, sondern gutes Design.`);
  if(wahl.glueck==="misch") S.push(`<b>Zu viel Glück?</b> Mehr Auswahl geben: ${mehr}. <b>Zu wenig?</b> Weniger Auswahl: ${wen}.`);
  if(wahl.trick==="falle") S.push(`<b>Fallen zu gemein?</b> Statt aussetzen nur ein Feld zurück.`);
  if(wahl.trick==="zeitdruck") S.push(`<b>Sanduhr zu hektisch?</b> Nimm eine Minute — oder lass sie erst ab Runde zwei laufen.`);
  S.push(`<b>Jemand langweilt sich, wenn er nicht dran ist?</b> Gib ihm eine Aufgabe: mitzählen, Karten umdrehen, auf die Zeit achten.`);
  return S;
}
function spielName(){
  const w=WELTEN[wahl.welt];
  return {rennen:`Wettlauf ${w.zielDat}`, sammeln:`${w.bonus}-Jagd`,
    fangen:`Flucht vor ${w.boeseDat}`, zusammen:`Rettet ${w.zielAkk}!`}[wahl.ziel];
}
function geschichte(){
  const w=WELTEN[wahl.welt];
  const zweiter={
    rennen:`Aber ${w.held1} ist nicht allein unterwegs. Alle wollen ${w.zielAkk} erreichen, und nur einer kommt zuerst an.`,
    sammeln:`Überall liegen ${w.bonus} herum. Wer am Ende die meisten eingesammelt hat, hat gewonnen.`,
    fangen:`Und dann ist da noch ${w.boeseNom}. Wer erwischt wird, ist raus.`,
    zusammen:`Alleine schafft das keiner. Ihr müsst es zusammen ${w.zielDat} schaffen — oder ihr verliert alle gemeinsam.`
  }[wahl.ziel];
  const dritter={falle:w.falleSatz, tausch:w.tauschSatz,
    abkuerzung:"Es gibt eine Abkürzung. Sie ist schneller. Sie ist auch gefährlicher.",
    bonus:`Und wer ${w.bonus} findet, bekommt eine Kraft, die er genau einmal einsetzen darf.`,
    zeitdruck:"Und keiner hat Zeit. Dreißig Sekunden pro Zug, dann ist der Nächste dran.",
    helfen:"Aber ihr dürft euch retten. Einmal, jeder."}[wahl.trick];
  return [...w.intro, zweiter, dritter];
}
function sprueche(){
  const w=WELTEN[wahl.welt];
  return w.sprueche.concat(["Du machst eine Pause. Alle anderen ziehen weiter.","Erzähl einen Witz. Wenn jemand lacht: ein Feld vor."]);
}

/* ============ Bauplan ============ */
function zeigeBauplan(){
  document.getElementById("frage").style.display="none";
  const w=WELTEN[wahl.welt], el=document.getElementById("bauplan");
  el.classList.add("an");
  const zeigeSprueche = wahl.mechanik==="karte" || wahl.trick==="bonus" || wahl.trick==="falle";
  el.innerHTML=`
  <div class="plan-kopf">
    <svg class="held" viewBox="0 0 200 132" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${P[wahl.welt]}</svg>
    <div class="txt">
      <div class="stempel">Bauplan · fertig zum Basteln</div>
      <input class="namensfeld" id="spielname" value="${spielName()}" aria-label="Name deines Spiels">
      <input class="erfinder" placeholder="Erfunden von …" aria-label="Erfunden von">
    </div>
  </div>

  <div class="geschichte">
    <h3>So fängt es an</h3>
    ${geschichte().map(s=>`<p>${s}</p>`).join("")}
  </div>

  <div class="bloecke">
    <div class="block weit">
      <h3><span class="pille" style="background:var(--teal-bg);color:var(--teal)">Spielplan</span> So sieht deine Welt auf dem Tisch aus</h3>
      <div class="brett-huelle">${brettSVG()}</div>
      <p class="brett-bei">Grün = Start${wahl.trick==="falle"?` · Rot = ${w.falle}`:""}${wahl.trick==="abkuerzung"?" · Gelb = Abkürzung":""}. Übertrag das mit Bleistift auf Pappe.</p>
    </div>
    <div class="block">
      <h3><span class="pille" style="background:var(--rot-bg);color:var(--rot)">Material</span> Das brauchst du</h3>
      <ul class="liste">${material().map(([n,x])=>`<li><span class="menge">${n}×</span><span>${x}</span></li>`).join("")}</ul>
    </div>
    <div class="block">
      <h3><span class="pille" style="background:var(--gelb-bg);color:var(--gelb)">Bauen</span> In dieser Reihenfolge</h3>
      <ol class="schritte">${bastelSchritte().map(s=>`<li>${s}</li>`).join("")}</ol>
    </div>
    <div class="block weit">
      <h3><span class="pille" style="background:var(--lila-bg);color:var(--lila)">Regeln</span> Dein Regelheft</h3>
      ${regeln().map(([k,v])=>`<div class="regel"><span class="regel-titel">${k}</span><p>${v}</p></div>`).join("")}
    </div>
    ${zeigeSprueche?`<div class="block weit">
      <h3><span class="pille" style="background:var(--teal-bg);color:var(--teal)">Karten</span> Sprüche für deine Karten</h3>
      <div class="spruchliste">${sprueche().map(s=>`<div class="spruch">${s}</div>`).join("")}</div>
    </div>`:""}
    <div class="block weit">
      <h3><span class="pille" style="background:var(--gelb-bg);color:var(--gelb)">Stellschrauben</span> Wenn beim Testen etwas nicht stimmt</h3>
      <ul class="liste">${stellschrauben().map(s=>`<li><span class="stellschraube">${s}</span></li>`).join("")}</ul>
    </div>
  </div>

  <div class="testauftrag">
    <h3>Dein Testauftrag</h3>
    <p>Lass zwei Kinder spielen, die dein Spiel noch nicht kennen. <strong>Du darfst nichts erklären
    und nichts verteidigen</strong> — nur zusehen und aufschreiben, wo sie hängenbleiben. Wenn sie die
    Regel nicht verstehen, ist die Regel schuld. Nicht die Spieler.</p>
    <p style="margin-top:10px">Danach änderst du <strong>genau eine Sache</strong> und lässt noch einmal spielen.</p>
  </div>

  <div class="fuss-steuer nodruck">
    <button class="knopf stark" id="nochmal">Noch ein Spiel erfinden</button>
    <button class="knopf" id="aendern">Letzte Entscheidung ändern</button>
    <span>Zum Ausdrucken: ⌘/Strg + P</span>
  </div>`;

  document.getElementById("nochmal").addEventListener("click",()=>{
    Object.keys(wahl).forEach(k=>delete wahl[k]);
    saetze.length=0; saetze.laenge0=0; schrittNr=0;
    el.classList.remove("an"); el.innerHTML="";
    zeichneErzaehler(); zeichneChips(); zeichneFrage();
    window.scrollTo({top:0,behavior:"smooth"});
  });
  document.getElementById("aendern").addEventListener("click",()=>{
    schrittNr=SCHRITTE.length-1;
    const s2=SCHRITTE[schrittNr];
    saetze.length=Math.max(0,saetze.length-erzaehle(s2.key).length);
    delete wahl[s2.key]; saetze.laenge0=saetze.length;
    el.classList.remove("an"); el.innerHTML="";
    zeichneErzaehler(); zeichneChips(); zeichneFrage();
    window.scrollTo({top:0,behavior:"smooth"});
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

saetze.laenge0=0;
zeichneErzaehler(); zeichneChips(); zeichneFrage();
</script>
